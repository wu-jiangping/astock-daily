name: A股日报定时推送

on:
  schedule:
    # GitHub 定时高峰会延迟 10-40 分钟 → 提前触发、卡点等待，确保准点推送。
    # 时间为 UTC；北京时间 = UTC + 8（每天推送，含周末）
    - cron: "20 23 * * *"    # 次日 07:20 排队 → 卡点 09:00 早报
    - cron: "50 2 * * *"     # 10:50 排队 → 卡点 12:30 午报
    - cron: "10 9 * * *"     # 17:10 排队 → 卡点 18:50 晚报
  workflow_dispatch:
    inputs:
      session:
        description: "场次"
        required: true
        default: "早报"
        type: choice
        options: [早报, 午报, 晚报]

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_OWNER: wu-jiangping
      IMG_REPO: astock-daily-img
      WX_CHANNEL: clawbot
      WX_DUP_IMAGE: "false"
      IMAGE_URL: "https://wu-jiangping.github.io/astock-daily-img/latest.jpg"
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pillow

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i --no-save playwright-core

      # 安装 Chromium 与中文字体（装完再等待，等待期不浪费）
      - name: 安装 Chromium
        run: |
          npm i --no-save playwright
          npx playwright install chromium
      - name: 安装中文字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 定位浏览器
        run: echo "CHROME_PATH=$(ls ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1)" >> $GITHUB_ENV

      - name: 判断场次
        run: |
          # 用北京时间判断（早报 cron 在 UTC 前一天触发，用 UTC 小时会错）
          h=$(date +%H)
          if   [ "$h" = "07" ] || [ "$h" = "08" ]; then S="早报"
          elif [ "$h" = "10" ] || [ "$h" = "11" ]; then S="午报"
          elif [ "$h" = "17" ] || [ "$h" = "18" ]; then S="晚报"
          else S="${{ github.event.inputs.session }}"; fi
          [ -z "$S" ] && S="早报"
          echo "SESSION=$S" >> $GITHUB_ENV
          echo "场次=$S (北京时间 hour=$h)"

      # 卡点等待：定时触发时睡到目标时刻前 75 秒（生成约 75 秒），手动触发不等待
      - name: 等待到准点
        if: env.GITHUB_EVENT_NAME == 'schedule'
        run: |
          python - <<'PYEOF'
          import time, datetime, os
          s = os.environ["SESSION"]
          tgt = {"早报": "09:00:00", "午报": "12:30:00", "晚报": "18:50:00"}[s]
          now = datetime.datetime.now()
          t = datetime.datetime.strptime(now.strftime("%Y-%m-%d ") + tgt, "%Y-%m-%d %H:%M:%S")
          wait = (t - datetime.timedelta(seconds=75) - now).total_seconds()
          if wait > 0:
              print("卡点等待 %.0f 秒（目标 %s %s）" % (wait, s, tgt), flush=True)
              time.sleep(min(wait, 6300))
              print("到点，开跑", flush=True)
          else:
              print("已过准点，直接开跑")
          PYEOF

      - name: 生成并推送企业微信
        run: python run_report.py "$SESSION"

      - name: 更新在线长图
        continue-on-error: true
        run: |
          if python _push_img.py; then
            echo "IMAGE_URL=https://wu-jiangping.github.io/astock-daily-img/latest.jpg" >> $GITHUB_ENV
          else
            echo "图上传失败，本次不附长图链接（避免指向旧图）"
            echo "IMAGE_URL=" >> $GITHUB_ENV
          fi

      - name: 推送个人微信
        run: python push_wechat.py "$SESSION"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: out/*.png
          retention-days: 7
